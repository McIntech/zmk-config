# ============================================
# DISPLAY CONFIGURATION
# ============================================
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_I2C=y

# ============================================
# NICE VIEW GEM ANIMATION SETTINGS
# ============================================
CONFIG_NICE_VIEW_GEM_ANIMATION=y
CONFIG_NICE_VIEW_GEM_ANIMATION_MS=800
CONFIG_NICE_VIEW_GEM_WPM_FIXED_RANGE=y
CONFIG_NICE_VIEW_GEM_WPM_FIXED_RANGE_MAX=120
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# ============================================
# BLE SPLIT CONFIGURATION
# ============================================
CONFIG_ZMK_SPLIT=y

# ============================================
# POWER MANAGEMENT
# ============================================
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ============================================
# BLE OPTIMIZATION
# ============================================
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_CONN=2

# ============================================
# DEBOUNCE SETTINGS
# ============================================
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10