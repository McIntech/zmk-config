---
include:
  # Corne OLED – Nice!Nano v2
  - board: nice_nano_v2
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME="Nice_Corne_Left"
    artifact-name: nice_corne_left
    snippet: studio-rpc-usb-uart

  - board: nice_nano_v2
    shield: corne_right
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME="Nice_Corne_Right"
    artifact-name: nice_corne_right

  # Settings reset (opcional pero recomendable)
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: nice_settings_reset
