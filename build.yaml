# Canonical list of board + shield build targets.
# This repo has no CI — build locally (see README "Building"). The format is
# ZMK's build-user-config matrix, so cloud builds work again if ever re-enabled.
#
---
include:
  - board: nice_nano_v2
    shield: corne_left
  - board: nice_nano_v2
    shield: corne_right
  - board: nice_nano_v2
    shield: settings_reset
